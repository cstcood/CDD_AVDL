# CDD-AVDL, paper geometry (IEEE TAFFC 2025, DOI 10.1109/TAFFC.2025.3571697)
#
# audio_len and visual_len are the only two numbers that have to be measured
# from the corpus; every other width in the network is derived from them.
# For the West China Hospital corpus the paper reports 1193 audio frames
# (wav2vec2 at 50 Hz) and 7168 visual frames (OpenGraphAU at 30 Hz).

model:
  audio_in_dim: 768
  audio_conv_out: 64
  audio_conv_kernel: 2

  ast_out_dim: 8
  ast_model_size: small224
  ast_fstride: 10
  ast_tstride: 10
  ast_imagenet_pretrain: true
  ast_audioset_pretrain: false
  ast_pretrained_dir: null

  visual_in_dim: 41
  mlstm_out_dim: 4
  mlstm_conv_channels: [128, 64, 32]
  mlstm_conv_kernels: [8, 5, 3]
  mlstm_lstm_hidden: 16
  mlstm_lstm_layers: 5
  mlstm_dropout: 0.7
  mlstm_se_reduction: 16

  window_size: 10
  window_stride: 10

  fusion_patch_sizes: [32, 32, 8]
  fusion_final_channels: 8
  fusion_weight: 0.5

  num_classes: 2

data:
  root: data
  audio_dir: audio
  visual_dir: visual
  label_file: labels.csv
  audio_len: 1193
  visual_len: 7168
  num_folds: 5
  fold: 0
  num_workers: 4
  pin_memory: true

train:
  epochs: 100
  batch_size: 8
  lr: 0.0001
  momentum: 0.9
  weight_decay: 0.0
  optimizer: sgd
  scheduler: cosine
  warmup_epochs: 0
  grad_clip: 0.0
  amp: true
  seed: 42
  device: cuda
  output_dir: runs/default
  early_stop_patience: 0
  monitor: loss
  log_interval: 10
